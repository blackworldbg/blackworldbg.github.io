<!doctype html><html lang="bg"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Black World — Първата следа</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 50% 15%,#20372b 0,#0b100e 48%,#040605 100%);color:#e6ece7;font-family:Georgia,serif;display:grid;place-items:center;padding:20px}.panel{width:min(100%,480px);border:1px solid #3b5747;border-radius:20px;padding:26px 23px;background:rgba(5,10,7,.9);box-shadow:0 20px 70px #000b}.brand{font:700 12px system-ui;letter-spacing:.42em;color:#91b89b;text-align:center}.step{font:12px system-ui;color:#98ad9e;text-align:center;margin:22px 0 8px}h1{font-size:clamp(25px,6vw,35px);text-align:center;line-height:1.2;margin:12px 0 20px}p{line-height:1.65;text-align:center;color:#c1cfc4}.scene{border:1px solid #344b3a;border-radius:13px;background:linear-gradient(140deg,#0e1a13,#111a15);padding:20px;margin:20px 0;text-align:center}.symbols{display:flex;justify-content:center;gap:18px;font-size:35px;margin:18px 0}.symbol{border:1px solid #3c5543;background:#101c15;border-radius:12px;min-width:66px;min-height:70px;display:grid;place-items:center;color:#a4c2a9}.symbol:focus-visible,.btn:focus-visible{outline:2px solid #d6e8d8}.btn{display:block;width:100%;border:1px solid #668875;border-radius:11px;padding:15px;background:#193425;color:#f0f6f1;font:600 15px system-ui;cursor:pointer;margin-top:12px}.btn.secondary{background:transparent}.choices{display:grid;gap:9px}.hint{min-height:25px;color:#e2b9a3;font:13px system-ui;text-align:center}.hide{display:none}.small{font:12px system-ui;color:#819a89;text-align:center;margin-top:20px}.mark{font-size:54px;color:#a6d0ad;text-align:center}.reveal{letter-spacing:.2em;color:#c1e3c6}</style></head><body><main class="panel"><div class="brand">BLACK WORLD</div><div class="step" id="progress">ПЪРВАТА СЛЕДА</div><h1 id="title">Виждаш ли всичко?</h1><p id="intro">Три изпитания. Една следа. Не бързай да вярваш на първото, което виждаш.</p><section id="stage"><div class="scene"><div class="symbols"><span class="symbol">◯</span><span class="symbol">◇</span><span class="symbol">△</span></div><p>Трите знака изглеждат еднакво важни. Но само един има четири страни.</p></div><button class="btn" id="start">Започни</button></section><div class="hint" id="hint" aria-live="polite"></div><div class="small">Демонстрация • Не разкрива тайни от романа или картите</div></main><script>const stage=document.getElementById('stage'),title=document.getElementById('title'),intro=document.getElementById('intro'),progress=document.getElementById('progress'),hint=document.getElementById('hint');let step=0;function btn(label,fn,cls=''){const b=document.createElement('button');b.className='btn '+cls;b.textContent=label;b.onclick=fn;return b}function draw(){hint.textContent='';stage.replaceChildren();progress.textContent=['СЛЕДА 1 ОТ 3','СЛЕДА 2 ОТ 3','СЛЕДА 3 ОТ 3','РАЗКРИТИЕ'][step];if(step===0){title.textContent='Погледни по-внимателно';intro.textContent='Кой от тези три знака има точно четири страни?';let scene=document.createElement('div');scene.className='scene';let symbols=document.createElement('div');symbols.className='symbols';[['◯',false],['◇',true],['△',false]].forEach(([s,ok])=>{let b=btn(s,()=>ok?next():hint.textContent='Това не е правилният знак. Погледни формата.');b.className='symbol';b.setAttribute('aria-label','Избери символ '+s);symbols.append(b)});scene.append(symbols);stage.append(scene)}else if(step===1){title.textContent='Втората следа';intro.textContent='Три думи. Коя от тях не можеш да върнеш, след като веднъж я изгубиш?';let choices=document.createElement('div');choices.className='choices';[['Пари',false],['Време',true],['Вещи',false]].forEach(([s,ok])=>choices.append(btn(s,()=>ok?next():hint.textContent='Помисли кое не може да бъде купено обратно.')));stage.append(choices)}else if(step===2){title.textContent='Последната врата';intro.textContent='Подреди трите действия така, че да оставиш света по-добър.';let choices=document.createElement('div');choices.className='choices';[['Виж → Подмини → Забрави',false],['Забележи → Действай → Промени',true],['Вземи → Използвай → Изхвърли',false]].forEach(([s,ok])=>choices.append(btn(s,()=>ok?next():hint.textContent='Търси пътя, който води до реална промяна.')));stage.append(choices)}else{title.textContent='Откри първата следа';intro.textContent='Не всеки, който гледа, вижда. Не всеки, който вижда, действа.';let scene=document.createElement('div');scene.className='scene';scene.innerHTML='<div class="mark">◇</div><p class="reveal">ИСТИНСКАТА СЛЕДА Е ДЕЙСТВИЕТО.</p><p>Това е само входът към света на Black World. Историята продължава в романа и 51-те карти.</p>';stage.append(scene,btn('Започни отначало',()=>{step=0;draw()},'secondary'))}}function next(){step++;draw()}document.getElementById('start').onclick=()=>draw();</script></body></html>
