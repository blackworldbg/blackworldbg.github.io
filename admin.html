<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Black World Admin</title>
<style>
:root{--green:#00ff88;--bg:#050706;--card:#0b100d;--line:#26342c;--muted:#91a098}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif;min-height:100vh}
.wrap{width:min(760px,92%);margin:0 auto;padding:42px 0}
h1{margin:0 0 8px;font-size:2rem} .sub{color:var(--muted);margin:0 0 28px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin:16px 0}
label{display:block;color:#b9c4be;font-size:.85rem;margin:12px 0 7px}
input{width:100%;padding:13px;border-radius:11px;border:1px solid #39453e;background:#050706;color:#fff;font-size:1rem}
button{border:0;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer}
.primary{background:var(--green);color:#00150b;width:100%;margin-top:16px}
.secondary{background:#18221d;color:#fff;border:1px solid #35453c}
.danger{background:#261113;color:#ff8f97;border:1px solid #66343a}
.hidden{display:none}
.row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.stockline{display:flex;gap:9px;align-items:center;margin-top:14px}
.stockline input{width:110px;text-align:center;font-size:1.2rem;font-weight:800}
.stockline button{min-width:48px;font-size:1.1rem}
.total{color:#9aa8a0;font-size:.85rem}
.msg{min-height:22px;margin-top:12px;color:#9fdcb9}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
@media(max-width:520px){.top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1>BLACK WORLD ADMIN</h1><p class="sub">Mystery Pack наличности</p></div>
    <button id="logoutBtn" class="danger hidden" onclick="logout()">Изход</button>
  </div>

  <section id="loginCard" class="card">
    <h2>Администраторски вход</h2>
    <label>Имейл</label>
    <input id="email" type="email" value="blackworld.global@gmail.com" autocomplete="username">
    <label>Парола</label>
    <input id="password" type="password" autocomplete="current-password">
    <button class="primary" onclick="login()">ВХОД</button>
    <div id="loginMsg" class="msg"></div>
  </section>

  <section id="adminPanel" class="hidden">
    <div id="products"></div>
    <div id="saveMsg" class="msg"></div>
  </section>
</div>

<script>
const SB_URL='https://qodhkroxmmvooohqnpvt.supabase.co';
const SB_KEY='sb_publishable_Kz7XitfkABLXiYocNBxzBA_FsRRiFnU';
const ADMIN_UID='cab0fcb3-c091-469a-8c14-6d631bbe9005';
const LABELS={love:'❤️ ЛЮБОВ',money:'💜 ПАРИ',nature:'💚 ПРИРОДА'};
let accessToken='';
let stock={};

async function login(){
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value;
  const msg=document.getElementById('loginMsg');
  msg.textContent='Влизане...';
  try{
    const r=await fetch(SB_URL+'/auth/v1/token?grant_type=password',{
      method:'POST',
      headers:{'apikey':SB_KEY,'Content-Type':'application/json'},
      body:JSON.stringify({email,password})
    });
    const data=await r.json();
    if(!r.ok) throw new Error(data.error_description||data.msg||'Грешен имейл или парола.');
    if(!data.user || data.user.id!==ADMIN_UID) throw new Error('Този акаунт няма администраторски достъп.');
    accessToken=data.access_token;
    sessionStorage.setItem('bw_admin_token',accessToken);
    showAdmin();
    await loadStock();
  }catch(e){msg.textContent=e.message;}
}

function logout(){
  accessToken='';
  sessionStorage.removeItem('bw_admin_token');
  document.getElementById('adminPanel').classList.add('hidden');
  document.getElementById('logoutBtn').classList.add('hidden');
  document.getElementById('loginCard').classList.remove('hidden');
  document.getElementById('password').value='';
}

function showAdmin(){
  document.getElementById('loginCard').classList.add('hidden');
  document.getElementById('adminPanel').classList.remove('hidden');
  document.getElementById('logoutBtn').classList.remove('hidden');
}

async function loadStock(){
  const r=await fetch(SB_URL+'/rest/v1/mystery_stock?select=id,name,total,remaining&order=id',{
    headers:{'apikey':SB_KEY,'Authorization':'Bearer '+accessToken}
  });
  if(!r.ok){logout(); throw new Error('Сесията е изтекла. Влез отново.');}
  const rows=await r.json();
  stock={};
  rows.forEach(x=>stock[x.id]=x);
  render();
}

function render(){
  const box=document.getElementById('products');
  box.innerHTML=['love','money','nature'].map(id=>{
    const x=stock[id]||{total:227,remaining:227};
    return `<div class="card">
      <div class="row"><div><h2 style="margin:0 0 5px">${LABELS[id]}</h2><div class="total">Общо количество: ${x.total}</div></div></div>
      <div class="stockline">
        <button class="secondary" onclick="step('${id}',-1)">−1</button>
        <input id="remain-${id}" type="number" min="0" max="${x.total}" value="${x.remaining}">
        <button class="secondary" onclick="step('${id}',1)">+1</button>
        <button class="primary" style="width:auto;margin:0" onclick="save('${id}')">ЗАПАЗИ</button>
      </div>
    </div>`;
  }).join('');
}

function step(id,n){
  const el=document.getElementById('remain-'+id);
  const max=Number(stock[id].total);
  el.value=Math.max(0,Math.min(max,Number(el.value||0)+n));
}

async function save(id){
  const el=document.getElementById('remain-'+id);
  const value=Number(el.value);
  const max=Number(stock[id].total);
  const msg=document.getElementById('saveMsg');
  if(!Number.isInteger(value)||value<0||value>max){
    msg.textContent='Въведи цяло число между 0 и '+max+'.'; return;
  }
  msg.textContent='Запазване...';
  const r=await fetch(SB_URL+'/rest/v1/mystery_stock?id=eq.'+encodeURIComponent(id),{
    method:'PATCH',
    headers:{
      'apikey':SB_KEY,
      'Authorization':'Bearer '+accessToken,
      'Content-Type':'application/json',
      'Prefer':'return=representation'
    },
    body:JSON.stringify({remaining:value})
  });
  if(!r.ok){
    const t=await r.text();
    msg.textContent='Неуспешно запазване. '+t;
    return;
  }
  stock[id].remaining=value;
  msg.textContent=LABELS[id]+' е обновено: остават '+value+'.';
}

(async function(){
  const token=sessionStorage.getItem('bw_admin_token');
  if(!token) return;
  accessToken=token;
  try{
    const r=await fetch(SB_URL+'/auth/v1/user',{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+accessToken}});
    const u=await r.json();
    if(!r.ok || u.id!==ADMIN_UID) throw new Error();
    showAdmin(); await loadStock();
  }catch(e){logout();}
})();
</script>
</body>
</html>
